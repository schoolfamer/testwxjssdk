name: YouTube Audio Relay Worker

on:
  repository_dispatch:
    types: [youtube_extract, youtube_feed_poll]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID from TranscripApi"
        required: true
        default: "test-manual-task"
      video_url:
        description: "YouTube Video URL to extract"
        required: true
        default: "https://youtu.be/9Jg5b9Fgt6M"
      callback_url:
        description: "Callback endpoint URL"
        required: false
        default: "https://transcript.unithought.com/api/internal/youtube_callback"

jobs:
  relay_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Deno (Recommended JS Engine for YouTube challenges)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js 22 (Fallback JS Engine)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start bgutil PO Token Provider (BotGuard Attestation Backend)
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3
          curl -s http://127.0.0.1:4416/ping || curl -s http://127.0.0.1:4416/ || echo "bgutil provider started"

      - name: Install System Dependencies (ffmpeg, curl, jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq

      - name: Install yt-dlp, EJS Solver and PO Token Provider Plugin
        run: |
          python -m pip install --upgrade pip "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider

      - name: Prepare YouTube Cookies (if configured)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            python3 -c '
          import os, time
          raw = os.environ.get("YT_COOKIES", "").strip()
          exp = str(int(time.time()) + 180 * 86400)
          lines = ["# Netscape HTTP Cookie File", "# Sanitized for YouTube and Google"]

          if raw.lstrip().startswith("#") or "\t" in raw:
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("#"):
                      lines.append(line)
                      continue
                  parts = line.split("\t")
                  if len(parts) >= 7:
                      name = parts[5].strip()
                      # Filter out rolling timestamp tokens that invalidate static cookies
                      if name in ("__Secure-1PSIDTS", "__Secure-3PSIDTS"):
                          continue
                      lines.append(line)
                      if ".youtube.com" in parts[0]:
                          google_part = parts.copy()
                          google_part[0] = ".google.com"
                          lines.append("\t".join(google_part))
          else:
              for part in raw.split(";"):
                  part = part.strip()
                  if "=" in part:
                      k, v = part.split("=", 1)
                      k, v = k.strip(), v.strip()
                      if k in ("__Secure-1PSIDTS", "__Secure-3PSIDTS"):
                          continue
                      if k:
                          sec = "TRUE" if k.startswith("__Secure-") else "FALSE"
                          lines.append(f".youtube.com\tTRUE\t/\t{sec}\t{exp}\t{k}\t{v}")
                          lines.append(f".google.com\tTRUE\t/\t{sec}\t{exp}\t{k}\t{v}")

          out = "\n".join(lines) + "\n"
          with open("/tmp/yt_cookies.txt", "w", encoding="utf-8") as f:
              f.write(out)
          print("YouTube Cookies prepared with rolling tokens stripped and google.com paired.")
          '
          fi

      - name: Debug Environment and Cookies
        run: |
          echo "=== Dependencies ==="
          python --version
          node --version
          deno --version
          yt-dlp --version
          if [ -f /tmp/yt_cookies.txt ]; then
            python3 -c '
          with open("/tmp/yt_cookies.txt") as f:
              lines = [l.strip() for l in f if l.strip()]
          print(f"Total cookie lines: {len(lines)}")
          for l in lines:
              if not l.startswith("#"):
                  parts = l.split("\t")
                  if len(parts) >= 7:
                      print(f"  Domain: {parts[0]} | Secure: {parts[3]} | Name: {parts[5]} | ValLen: {len(parts[6])}")
                  else:
                      print(f"  Raw: {l[:40]}...")
          '
          else
            echo "No cookies configured."
          fi

      - name: Poll YouTube Channel / Playlist Feed
        if: github.event.action == 'youtube_feed_poll'
        env:
          FEED_ID: ${{ github.event.client_payload.feed_id }}
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          echo "Polling YouTube Feed: $FEED_ID ($TARGET_URL)"
          yt-dlp $COOKIE_ARG \
            --remote-components ejs:github \
            --js-runtimes deno \
            --flat-playlist --playlist-end 15 --dump-single-json --no-warnings "$TARGET_URL" > /tmp/feed.json || true

          python3 -c '
          import json, os
          feed_id = os.environ.get("FEED_ID", "")
          try:
              with open("/tmp/feed.json") as f:
                  data = json.load(f)
              entries = data.get("entries", [])
              items = []
              for e in entries[:15]:
                  vid = e.get("id")
                  if not vid: continue
                  items.append({
                      "id": vid,
                      "title": e.get("title") or "YouTube Video",
                      "url": e.get("url") or f"https://www.youtube.com/watch?v={vid}",
                      "duration": e.get("duration") or 0
                  })
              print(json.dumps({"feed_id": feed_id, "items": items}, ensure_ascii=False))
          except Exception as ex:
              print(json.dumps({"feed_id": feed_id, "items": [], "error": str(ex)}))
          ' > /tmp/payload.json

          curl -s -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json

      - name: Extract YouTube Audio and Relay
        if: github.event.action != 'youtube_feed_poll'
        env:
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TASK_ID="${{ github.event.client_payload.task_id }}"
            VIDEO_URL="${{ github.event.client_payload.video_url }}"
            CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          else
            TASK_ID="${{ github.event.inputs.task_id }}"
            VIDEO_URL="${{ github.event.inputs.video_url }}"
            CALLBACK_URL="${{ github.event.inputs.callback_url }}"
          fi

          if [ -z "$CALLBACK_URL" ]; then
            CALLBACK_URL="https://transcript.unithought.com/api/internal/youtube_callback"
          fi

          # Clean URL parameters (strip &t=, &pp=, etc., keep clean watch?v= or youtu.be/)
          CLEAN_URL=$(python3 -c '
          import sys, re
          raw = sys.argv[1].strip()
          m = re.search(r"[?&]v=([a-zA-Z0-9_-]{11})", raw) or re.search(r"youtu\.be/([a-zA-Z0-9_-]{11})", raw)
          print(f"https://www.youtube.com/watch?v={m.group(1)}" if m else raw)
          ' "$VIDEO_URL")
          echo "Target clean URL: $CLEAN_URL"

          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          # 1. Fetch metadata
          echo "Fetching metadata..."
          METADATA_JSON=$(yt-dlp $COOKIE_ARG \
            --remote-components ejs:github \
            --js-runtimes deno \
            --no-playlist --dump-json --no-warnings "$CLEAN_URL" 2>/dev/null || true)

          if [ -z "$METADATA_JSON" ] && [ -n "$COOKIE_ARG" ]; then
            echo "Metadata fetch with cookies failed, retrying without cookies..."
            METADATA_JSON=$(yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --no-playlist --dump-json --no-warnings "$CLEAN_URL" 2>/dev/null || true)
          fi

          if [ -z "$METADATA_JSON" ]; then
            echo "Retrying metadata with mweb client..."
            METADATA_JSON=$(yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --extractor-args "youtube:player-client=mweb" \
              --no-playlist --dump-json --no-warnings "$CLEAN_URL" 2>/dev/null || true)
          fi

          if [ -n "$METADATA_JSON" ]; then
            TITLE=$(echo "$METADATA_JSON" | jq -r '.title // "YouTube Video"')
            AUTHOR=$(echo "$METADATA_JSON" | jq -r '.uploader // .channel // "未知UP主"')
            DURATION=$(echo "$METADATA_JSON" | jq -r '.duration // 0')
          else
            TITLE="YouTube Video"
            AUTHOR="YouTube"
            DURATION="0"
          fi
          echo "Title: $TITLE | Author: $AUTHOR | Duration: $DURATION"

          # 2. Extract audio with resilient multi-attempt fallback ladder
          SUCCESS=0

          # Attempt 1: With sanitized cookies + PO Token Provider + Deno EJS solver
          if [ -n "$COOKIE_ARG" ]; then
            echo "=== Attempt 1: Downloading with sanitized cookies + PO Token Provider ==="
            yt-dlp $COOKIE_ARG \
              --remote-components ejs:github \
              --js-runtimes deno \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt1.log 2>&1 || true

            cat /tmp/attempt1.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 2: mweb client WITH PO Token Provider (Recommended combination for bypass)
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 2: Downloading with mweb client + PO Token Provider (no cookies) ==="
            yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --extractor-args "youtube:player-client=mweb" \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt2.log 2>&1 || true

            cat /tmp/attempt2.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 3: iOS client WITHOUT cookies
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 3: Downloading with iOS client (no cookies) ==="
            yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --extractor-args "youtube:player-client=ios" \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt3.log 2>&1 || true

            cat /tmp/attempt3.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 4: Android client WITHOUT cookies
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 4: Downloading with Android client (no cookies) ==="
            yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --extractor-args "youtube:player-client=android" \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt4.log 2>&1 || true

            cat /tmp/attempt4.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 5: Clean datacenter IP default client WITHOUT cookies
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 5: Downloading without cookies (clean datacenter IP) ==="
            yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt5.log 2>&1 || true

            cat /tmp/attempt5.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 6: Web Creator + MWeb fallback
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 6: Downloading with web_creator,mweb fallback ==="
            yt-dlp \
              --remote-components ejs:github \
              --js-runtimes deno \
              --extractor-args "youtube:player-client=web_creator,mweb" \
              --no-playlist \
              -x --audio-format mp3 --audio-quality 128K \
              --retries 3 --fragment-retries 3 \
              --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" > /tmp/attempt6.log 2>&1 || true

            cat /tmp/attempt6.log | tail -n 15
            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # 3. Handle failure if still not found
          if [ ! -f "extracted_audio.mp3" ]; then
            ERR_MSG="GitHub Actions overseas runner failed to download audio stream across all fallback clients"
            echo "ERROR: Audio extraction failed: $ERR_MSG"
            curl -s -X POST "$CALLBACK_URL/fail" \
              -H "Authorization: Bearer $AUTH_TOKEN" \
              -F "task_id=$TASK_ID" \
              -F "error=$ERR_MSG" || true
            exit 1
          fi

          echo "Audio extraction successful! File size: $(stat -c%s extracted_audio.mp3 2>/dev/null || stat -f%z extracted_audio.mp3) bytes"

          # 4. Upload to callback
          HTTP_STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -F "task_id=$TASK_ID" \
            -F "file=@extracted_audio.mp3;type=audio/mpeg" \
            -F "title=$TITLE" \
            -F "author=$AUTHOR" \
            -F "duration=$DURATION")

          echo "Callback HTTP status: $HTTP_STATUS"
          cat /tmp/resp.txt || true

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Callback returned error status: $HTTP_STATUS"
            exit 1
          fi
