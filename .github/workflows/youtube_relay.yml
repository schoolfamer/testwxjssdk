name: YouTube Audio Relay Worker

on:
  repository_dispatch:
    types: [youtube_extract, youtube_feed_poll]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID from TranscripApi"
        required: true
        default: "test-manual-task"
      video_url:
        description: "YouTube Video URL to extract"
        required: true
        default: "https://youtu.be/9Jg5b9Fgt6M"
      callback_url:
        description: "Callback endpoint URL"
        required: false
        default: "https://transcript.unithought.com/api/internal/youtube_callback"

jobs:
  relay_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (ffmpeg, curl, jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip yt-dlp

      - name: Prepare YouTube Cookies (if configured)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf "%s" "$YT_COOKIES" > /tmp/yt_cookies.txt
            echo "YouTube Cookies loaded for bot-check bypass."
          fi

      - name: Poll YouTube Channel / Playlist Feed
        if: github.event.action == 'youtube_feed_poll'
        env:
          FEED_ID: ${{ github.event.client_payload.feed_id }}
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          echo "Polling YouTube Feed: $FEED_ID ($TARGET_URL)"
          yt-dlp $COOKIE_ARG --flat-playlist --playlist-end 15 --dump-single-json --no-warnings "$TARGET_URL" > /tmp/feed.json || true

          python3 - << 'EOF' > /tmp/payload.json
          import json, os
          feed_id = os.environ.get("FEED_ID", "")
          try:
              with open("/tmp/feed.json") as f:
                  data = json.load(f)
              entries = data.get("entries", [])
              items = []
              for e in entries[:15]:
                  vid = e.get("id")
                  if not vid: continue
                  items.append({
                      "id": vid,
                      "title": e.get("title") or "YouTube Video",
                      "url": e.get("url") or f"https://www.youtube.com/watch?v={vid}",
                      "duration": e.get("duration") or 0
                  })
              print(json.dumps({"feed_id": feed_id, "items": items}, ensure_ascii=False))
          except Exception as ex:
              print(json.dumps({"feed_id": feed_id, "items": [], "error": str(ex)}))
          EOF

          curl -s -X POST "$CALLBACK_URL"             -H "Authorization: Bearer $AUTH_TOKEN"             -H "Content-Type: application/json"             -d @/tmp/payload.json

      - name: Extract YouTube Audio and Relay
        if: github.event.action != 'youtube_feed_poll'
        env:
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TASK_ID="${{ github.event.client_payload.task_id }}"
            VIDEO_URL="${{ github.event.client_payload.video_url }}"
            CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          else
            TASK_ID="${{ github.event.inputs.task_id }}"
            VIDEO_URL="${{ github.event.inputs.video_url }}"
            CALLBACK_URL="${{ github.event.inputs.callback_url }}"
          fi

          if [ -z "$CALLBACK_URL" ]; then
            CALLBACK_URL="https://transcript.unithought.com/api/internal/youtube_callback"
          fi

          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          METADATA_JSON=$(yt-dlp $COOKIE_ARG --js-runtimes node --extractor-args "youtube:player-client=web,ios" --no-playlist --dump-json --no-warnings "$VIDEO_URL" 2>/dev/null || true)

          if [ -n "$METADATA_JSON" ]; then
            TITLE=$(echo "$METADATA_JSON" | jq -r '.title // "YouTube Video"')
            AUTHOR=$(echo "$METADATA_JSON" | jq -r '.uploader // .channel // "未知UP主"')
            DURATION=$(echo "$METADATA_JSON" | jq -r '.duration // 0')
          else
            TITLE="YouTube Video"
            AUTHOR="YouTube"
            DURATION="0"
          fi

          yt-dlp $COOKIE_ARG --js-runtimes node --extractor-args "youtube:player-client=web,ios" --no-playlist -x --audio-format mp3 --audio-quality 128K --force-overwrites -o "extracted_audio.%(ext)s" "$VIDEO_URL" || true

          if [ ! -f "extracted_audio.mp3" ]; then
            curl -s -X POST "$CALLBACK_URL/fail"               -H "Authorization: Bearer $AUTH_TOKEN"               -F "task_id=$TASK_ID"               -F "error=GitHub Actions overseas runner failed to download audio stream (bot check or unavailable)" || true
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$CALLBACK_URL"             -H "Authorization: Bearer $AUTH_TOKEN"             -F "task_id=$TASK_ID"             -F "file=@extracted_audio.mp3;type=audio/mpeg"             -F "title=$TITLE"             -F "author=$AUTHOR"             -F "duration=$DURATION")

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            exit 1
          fi
