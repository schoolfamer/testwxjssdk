name: YouTube Audio Relay Worker

on:
  repository_dispatch:
    types: [youtube_extract, youtube_feed_poll]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID from TranscripApi"
        required: true
        default: "test-manual-task"
      video_url:
        description: "YouTube Video URL to extract"
        required: true
        default: "https://youtu.be/9Jg5b9Fgt6M"
      callback_url:
        description: "Callback endpoint URL"
        required: false
        default: "https://transcript.unithought.com/api/internal/youtube_callback"

jobs:
  relay_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Deno (Recommended JS Engine for YouTube challenges)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js 22 (Fallback JS Engine)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (ffmpeg, curl, jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq

      - name: Install yt-dlp and EJS Challenge Solver
        run: |
          python -m pip install --upgrade pip "yt-dlp[default]" yt-dlp-ejs

      - name: Prepare YouTube Cookies (if configured)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            python3 - << 'EOF'
          import os, time
          raw = os.environ.get("YT_COOKIES", "").strip()
          if raw.lstrip().startswith("#") or "	" in raw:
              out = raw + "
"
          else:
              lines = ["# Netscape HTTP Cookie File", "# Auto-converted from Cookie header"]
              exp = str(int(time.time()) + 180 * 86400)
              for part in raw.split(";"):
                  part = part.strip()
                  if "=" in part:
                      k, v = part.split("=", 1)
                      k, v = k.strip(), v.strip()
                      if k:
                          sec = "TRUE" if k.startswith("__Secure-") else "FALSE"
                          lines.append(f".youtube.com	TRUE	/	{sec}	{exp}	{k}	{v}")
              out = "
".join(lines) + "
"
          with open("/tmp/yt_cookies.txt", "w", encoding="utf-8") as f:
              f.write(out)
          print("YouTube Cookies prepared in Netscape format.")
          EOF
          fi

      - name: Poll YouTube Channel / Playlist Feed
        if: github.event.action == 'youtube_feed_poll'
        env:
          FEED_ID: ${{ github.event.client_payload.feed_id }}
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          echo "Polling YouTube Feed: $FEED_ID ($TARGET_URL)"
          yt-dlp $COOKIE_ARG             --remote-components ejs:github             --js-runtimes deno,node             --flat-playlist --playlist-end 15 --dump-single-json --no-warnings "$TARGET_URL" > /tmp/feed.json || true

          python3 - << 'EOF' > /tmp/payload.json
          import json, os
          feed_id = os.environ.get("FEED_ID", "")
          try:
              with open("/tmp/feed.json") as f:
                  data = json.load(f)
              entries = data.get("entries", [])
              items = []
              for e in entries[:15]:
                  vid = e.get("id")
                  if not vid: continue
                  items.append({
                      "id": vid,
                      "title": e.get("title") or "YouTube Video",
                      "url": e.get("url") or f"https://www.youtube.com/watch?v={vid}",
                      "duration": e.get("duration") or 0
                  })
              print(json.dumps({"feed_id": feed_id, "items": items}, ensure_ascii=False))
          except Exception as ex:
              print(json.dumps({"feed_id": feed_id, "items": [], "error": str(ex)}))
          EOF

          curl -s -X POST "$CALLBACK_URL"             -H "Authorization: Bearer $AUTH_TOKEN"             -H "Content-Type: application/json"             -d @/tmp/payload.json

      - name: Extract YouTube Audio and Relay
        if: github.event.action != 'youtube_feed_poll'
        env:
          AUTH_TOKEN: ${{ secrets.CALLBACK_TOKEN || secrets.MASTER_SECRET || 'Unithought2425' }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TASK_ID="${{ github.event.client_payload.task_id }}"
            VIDEO_URL="${{ github.event.client_payload.video_url }}"
            CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          else
            TASK_ID="${{ github.event.inputs.task_id }}"
            VIDEO_URL="${{ github.event.inputs.video_url }}"
            CALLBACK_URL="${{ github.event.inputs.callback_url }}"
          fi

          if [ -z "$CALLBACK_URL" ]; then
            CALLBACK_URL="https://transcript.unithought.com/api/internal/youtube_callback"
          fi

          # Clean URL parameters (strip &t=, &pp=, etc., keep clean watch?v= or youtu.be/)
          CLEAN_URL=$(python3 -c "
          import sys, re
          raw = sys.argv[1].strip()
          m = re.search(r'[?&]v=([a-zA-Z0-9_-]{11})', raw) or re.search(r'youtu\.be/([a-zA-Z0-9_-]{11})', raw)
          print(f'https://www.youtube.com/watch?v={m.group(1)}' if m else raw)
          " "$VIDEO_URL")
          echo "Target clean URL: $CLEAN_URL"

          COOKIE_ARG=""
          if [ -f /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          # 1. Fetch metadata with multi-tier fallback
          echo "Fetching metadata..."
          METADATA_JSON=$(yt-dlp $COOKIE_ARG             --remote-components ejs:github             --js-runtimes deno,node             --no-playlist --dump-json --no-warnings "$CLEAN_URL" 2>/dev/null || true)

          if [ -z "$METADATA_JSON" ] && [ -n "$COOKIE_ARG" ]; then
            echo "Metadata fetch with cookies failed, retrying without cookies..."
            METADATA_JSON=$(yt-dlp               --remote-components ejs:github               --js-runtimes deno,node               --no-playlist --dump-json --no-warnings "$CLEAN_URL" 2>/dev/null || true)
          fi

          if [ -n "$METADATA_JSON" ]; then
            TITLE=$(echo "$METADATA_JSON" | jq -r '.title // "YouTube Video"')
            AUTHOR=$(echo "$METADATA_JSON" | jq -r '.uploader // .channel // "未知UP主"')
            DURATION=$(echo "$METADATA_JSON" | jq -r '.duration // 0')
          else
            TITLE="YouTube Video"
            AUTHOR="YouTube"
            DURATION="0"
          fi
          echo "Title: $TITLE | Author: $AUTHOR | Duration: $DURATION"

          # 2. Extract audio with resilient multi-attempt fallback ladder
          SUCCESS=0

          # Attempt 1: With cookies (if provided) + Deno/Node EJS solver
          if [ -n "$COOKIE_ARG" ]; then
            echo "=== Attempt 1: Downloading audio with cookies and EJS solver ==="
            yt-dlp $COOKIE_ARG               --remote-components ejs:github               --js-runtimes deno,node               --no-playlist               -x --audio-format mp3 --audio-quality 128K               --retries 3 --fragment-retries 3               --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" 2> /tmp/ytdlp_err.log || true

            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 2: Without cookies (if attempt 1 failed or no cookies)
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 2: Downloading audio without cookies (clean datacenter IP) ==="
            yt-dlp               --remote-components ejs:github               --js-runtimes deno,node               --no-playlist               -x --audio-format mp3 --audio-quality 128K               --retries 3 --fragment-retries 3               --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" 2> /tmp/ytdlp_err.log || true

            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 3: Fallback with mobile/android player clients
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 3: Downloading audio with android,mweb client fallback ==="
            yt-dlp               --remote-components ejs:github               --js-runtimes deno,node               --extractor-args "youtube:player-client=android,mweb"               --no-playlist               -x --audio-format mp3 --audio-quality 128K               --retries 3 --fragment-retries 3               --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" 2> /tmp/ytdlp_err.log || true

            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # Attempt 4: Fallback with web_creator,mweb
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 4: Downloading audio with web_creator,mweb fallback ==="
            yt-dlp               --remote-components ejs:github               --js-runtimes deno,node               --extractor-args "youtube:player-client=web_creator,mweb"               --no-playlist               -x --audio-format mp3 --audio-quality 128K               --retries 3 --fragment-retries 3               --force-overwrites -o "extracted_audio.%(ext)s" "$CLEAN_URL" 2> /tmp/ytdlp_err.log || true

            if [ -f "extracted_audio.mp3" ]; then
              SUCCESS=1
            fi
          fi

          # 3. Handle failure if still not found
          if [ ! -f "extracted_audio.mp3" ]; then
            ERR_MSG="GitHub Actions overseas runner failed to download audio stream"
            if [ -f /tmp/ytdlp_err.log ]; then
              TAIL_ERR=$(tail -n 5 /tmp/ytdlp_err.log | tr '
' ' ' | sed 's/"//g')
              if [ -n "$TAIL_ERR" ]; then
                ERR_MSG="$ERR_MSG: $TAIL_ERR"
              fi
            fi
            echo "ERROR: Audio extraction failed: $ERR_MSG"
            curl -s -X POST "$CALLBACK_URL/fail"               -H "Authorization: Bearer $AUTH_TOKEN"               -F "task_id=$TASK_ID"               -F "error=$ERR_MSG" || true
            exit 1
          fi

          echo "Audio extraction successful! File size: $(stat -c%s extracted_audio.mp3 2>/dev/null || stat -f%z extracted_audio.mp3) bytes"

          # 4. Upload to callback
          HTTP_STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$CALLBACK_URL"             -H "Authorization: Bearer $AUTH_TOKEN"             -F "task_id=$TASK_ID"             -F "file=@extracted_audio.mp3;type=audio/mpeg"             -F "title=$TITLE"             -F "author=$AUTHOR"             -F "duration=$DURATION")

          echo "Callback HTTP status: $HTTP_STATUS"
          cat /tmp/resp.txt || true

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Callback returned error status: $HTTP_STATUS"
            exit 1
          fi
